# Every {min, baseline, max} range parameter under `technologies`/`regions`
# below is resolved via config.config_loader.resolve_param() (direct) or
# resolve_inverted_param() (WACC only -- see that function's docstring).
# The pipeline no longer selects a single scenario branch: it ALWAYS runs
# three COMBINED scenarios sequentially and reports LCOH as a range.
#
#   min (worst case)  = WACC at each RangeParam's own `max` + capacity
#                        factor at `min` + capacity density at `min` +
#                        renewable CAPEX at `capex_range` max, ALL AT ONCE.
#   baseline           = every parameter at its own `baseline`.
#   max (best case)    = WACC at each RangeParam's own `min` + capacity
#                        factor at `max` + capacity density at `max` +
#                        renewable CAPEX at `capex_range` min, ALL AT ONCE.
#
# This is a simultaneous worst/best combination, not an independent
# one-at-a-time corner (that's what sensitivity: below already does) --
# see METHODOLOGY.md's "Combined scenarios" subsection and
# docs/memory/05_economic_model.md for the full rationale.

regions:
  brazil:
    name: "Brazil - Northeast"
    grid_crs: "+proj=aea +lat_1=-5 +lat_2=-15 +lat_0=-10 +lon_0=-40 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs"
    # Emerging-market financing costs; solar<wind spread per Steffen (2020).
    # See docs/memory/05_economic_model.md.
    wacc:
      solar:
        min: 0.08
        baseline: 0.11
        max: 0.20
      wind:
        min: 0.10
        baseline: 0.12
        max: 0.24
    capex_multiplier: 1.15
    # Brazil-only onshore wind CAPEX override (IRENA/EPE benchmarks for
    # competitive Northeast Brazil projects); range sibling is the
    # min/max-scenario CAPEX source below. See docs/memory/05_economic_model.md.
    onshore_wind_capex_override_usd_per_kw: 1050.0
    onshore_wind_capex_range_override_usd_per_kw: [800.0, 1550.0]
    # Preserves Brazil's own solar CAPEX unchanged (ADR-012) after
    # renewables.solar_pv's shared value below was updated for Germany
    # (ABUZAYED & HARTMANN, 2022) -- these are the pipeline's PRIOR shared
    # values, not a new Brazil-specific benchmark.
    solar_pv_capex_override_usd_per_kw: 700.0
    solar_pv_capex_range_override_usd_per_kw: [500.0, 1000.0]
    incentives:
      tax_credit_pct: 0.0
      # Brazil: no per-kg production credit exists today. REHIDRO is a
      # 5-year tax suspension on CAPEX (PIS/Pasep/Cofins), not a
      # production subsidy. PHBC (R$ 18.3B for 2028-2032) is future and
      # not yet operational. Zeroed rather than modeled as a fake flat
      # credit -- see METHODOLOGY.md's "Incentive Landscape and Policy
      # Implications" subsection and docs/memory/05_economic_model.md.
      production_credit_usd_per_kg: 0.0
      support_period_years: 10
  germany:
    name: "Germany - Schleswig-Holstein/Niedersachsen"
    grid_crs: "+proj=aea +lat_1=53 +lat_2=54.5 +lat_0=53.75 +lon_0=9.5 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs"
    wacc:
      solar:
        min: 0.02
        baseline: 0.03
        max: 0.05
      wind:
        min: 0.02
        baseline: 0.04
        max: 0.07
    capex_multiplier: 1.00
    incentives:
      # Germany: no universal per-kg production credit exists. Support is
      # via IPCEI (project-specific investment aid), H2Global (import
      # market-maker, EUR900M), and CCfD (carbon contracts). These are not
      # modeled as flat per-kg credits. Zeroed rather than modeled as a
      # fake flat credit -- see METHODOLOGY.md's "Incentive Landscape and
      # Policy Implications" subsection and docs/memory/05_economic_model.md.
      production_credit_usd_per_kg: 0.0
      support_period_years: 10

# Literature-validated {min, baseline, max} ranges for capacity_factor
# (region- and technology-specific) and capacity_density_mw_per_km2
# (technology-specific only). full_load_hours = capacity_factor * 8760,
# stored explicitly and cross-checked against capacity_factor at load time
# by config_loader.py's TechRegionParams validator. Full literature review:
# docs/memory/09_methodology_assumptions.md (capacity factor) and
# docs/memory/10_capacity_density_assumptions.md (capacity density).
technologies:
  solar_pv:
    brazil:
      capacity_factor:
        min: 0.20
        baseline: 0.24
        max: 0.30
      full_load_hours:
        min: 1752
        baseline: 2102
        max: 2628
      capacity_density_mw_per_km2:
        min: 43
        baseline: 51.5
        max: 60
    germany:
      # ABUZAYED & HARTMANN (2022) -- see docs/memory/05_economic_model.md.
      capacity_factor:
        min: 0.092
        baseline: 0.12
        max: 0.146
      full_load_hours:
        min: 805.9
        baseline: 1051.2
        max: 1279.0
      capacity_density_mw_per_km2:
        min: 43
        baseline: 51.5
        max: 60
  onshore_wind:
    brazil:
      # IRENA (2024): Brazil's newly-commissioned onshore CF hit a 56%
      # global-high weighted average (modern 4-6 MW/120-150m turbines) --
      # excluded from baseline as a not-yet-generalizable fleet outlier.
      # MDPI (2025) operational NE farms: Chafariz(PB) 43%, Assurua 41%,
      # Lagoa dos Ventos 39%, Alto do Sertao 41%, Rio do Vento 37%, Chui(RS,
      # older turbines) 35%. min=0.30 kept conservative; baseline=0.36 is
      # the operational-farm weighted average; max=0.42 gives margin above
      # Chafariz for newer 5-6 MW turbines. See docs/memory/05_economic_model.md.
      capacity_factor:
        min: 0.30
        baseline: 0.36
        max: 0.42
      full_load_hours:
        min: 2628.0
        baseline: 3153.6
        max: 3679.2
      capacity_density_mw_per_km2:
        min: 4.1
        baseline: 8.9
        max: 13.7
    germany:
      # ABUZAYED & HARTMANN (2022) -- see docs/memory/05_economic_model.md.
      capacity_factor:
        min: 0.196
        baseline: 0.32
        max: 0.365
      full_load_hours:
        min: 1717.0
        baseline: 2803.2
        max: 3197.4
      capacity_density_mw_per_km2:
        min: 4.1
        baseline: 8.9
        max: 13.7

electrolyzer:
  technologies:
    pem:
      capex_usd_per_kw: 1200.0
      efficiency_kwh_per_kg: 52.0
      stack_replacement_pct_of_capex: 0.15
      stack_lifetime_hours: 80000
    alkaline:
      # IRENA (2020) benchmark, METHODOLOGY.md 2.5.
      capex_usd_per_kw: 700.0
      efficiency_kwh_per_kg: 51.0
      stack_replacement_pct_of_capex: 0.10
      stack_lifetime_hours: 90000
  shared:
    opex_pct_of_capex: 0.02
    lifetime_years: 20
    # water_cost_usd_per_m3 x water_consumption_l_per_kg = 0.05 USD/kg H2
    # (METHODOLOGY.md 2.5). Recalibrate water_cost_usd_per_m3 = 0.05 /
    # (water_consumption_l_per_kg / 1000) if water_consumption_l_per_kg changes.
    water_cost_usd_per_m3: 5.5556
    water_consumption_l_per_kg: 9.0

# CAPEX/lifetime/OPEX only -- capacity_factor_default and
# power_density_w_per_m2 moved to `technologies` above.
# Shared values below are ABUZAYED & HARTMANN (2022) Germany benchmarks
# (EUR/USD fixed at 1.10); Brazil is shielded from this update via its own
# solar_pv_capex_override_usd_per_kw / onshore_wind_capex_override_usd_per_kw
# region overrides above -- see docs/memory/05_economic_model.md.
renewables:
  solar_pv:
    capex_usd_per_kw: 660.0   # 600 EUR/kW * 1.10
    capex_range: [500.0, 900.0]
    lifetime_years: 25
    opex_pct_of_capex: 0.015
  onshore_wind:
    capex_usd_per_kw: 1317.0  # 1197 EUR/kW * 1.10
    capex_range: [1000.0, 1700.0]
    lifetime_years: 25
    opex_pct_of_capex: 0.02

topsis:
  weights:
    resource_quality: 0.35
    proximity_infrastructure: 0.25
    land_availability: 0.20
    grid_distance: 0.20
  # "vector" is the published/primary normalization (METHODOLOGY.md 2.3)
  # and MUST stay the default -- see docs/memory/04_spatial_methodology.md.
  # "adaptive" only runs as a side-by-side robustness comparison, never
  # feeding into site_selection/h2_potential.
  normalization:
    method: "vector"
    cv_threshold: 0.10
    run_adaptive_robustness_check: true

thresholds:
  # Per-region exclusion buffer around protected-area boundaries, applied by
  # exclusion_mask.py before rasterizing (METHODOLOGY.md 2.3, ADR-011). Not
  # a shared scalar: Brazil's federal protected areas are strict no-use
  # reserves; Germany's dataset is Natura 2000, which permits sustainable RE
  # development under EU law, so a uniform 2 km buffer over-excluded Germany
  # (~60% of the study region). See docs/memory/04_spatial_methodology.md.
  min_distance_to_protected_area_km:
    brazil: 2.0   # federal protected areas (UCs federais) -- strict conservation units
    germany: 0.5  # Natura 2000 allows sustainable use; 2 km excluded ~60% of the region
  # min_contiguous_suitable_area_km2 (floor) and max_contiguous_suitable_area_km2
  # (ceiling, oversized clusters trimmed to their own top-suitability subset)
  # bound a realistic GW-scale hydrogen hub footprint -- see site_selection.py.
  min_contiguous_suitable_area_km2: 50.0
  max_contiguous_suitable_area_km2: 2000.0

sensitivity:
  wacc_steps: 10
  capex_multiplier_range: [0.7, 1.3]
  capex_multiplier_steps: 7
  monte_carlo_iterations: 1000

# 2D WACC_BR x WACC_DE competitiveness frontier, replacing the old 1D
# Brazil-only inversion search (ADR-009, 06_technical_decisions_log.md).
# Deterministic grid per technology, all non-WACC parameters at baseline.
# See METHODOLOGY.md's "2D WACC competitiveness frontier" subsection.
competitiveness_frontier:
  wacc_steps: 18            # 15-20 grid points per axis, both techs
  parity_tolerance_pct: 0.05  # relative to mean(LCOH_BR, LCOH_DE)
